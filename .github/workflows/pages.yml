# 03 画面設計の試作を GitHub Pages に公開する（仮。07 の土台の WS で、ビルドした成果物を公開する本物に置き換える）
# 最初の公開の前に、Settings → Pages の Source を「GitHub Actions」にしておく
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は 1 つずつ。途中の公開は止めない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # 公開するのは試作（prototype/）と、そこへの案内のページだけ
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r prototype site/prototype
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>WIZ ～死霊術師の迷宮～（準備中）</title></head>
          <body style="background:#0B0A0F;color:#E8DCC0;font-family:monospace;padding:16px">
          <p>WIZ ～死霊術師の迷宮～ は準備中です。</p>
          <p><a style="color:#FFC845" href="./prototype/">画面の試作を開く</a></p>
          </body></html>
          HTML
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
