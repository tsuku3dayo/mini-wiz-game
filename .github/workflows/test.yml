# PR と main への push で、検査（lint・成果物の整合性・単体・build・成果物の検査）と E2E を動かす（仕様書 §30.6）
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じブランチの古い実行は取り消す
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ブラウザの取得は 4 分で打ち切り、3 回まで試す（--with-deps は使わない）
      - name: Install Chromium
        run: |
          for i in 1 2 3; do
            timeout 240 npx playwright install chromium && exit 0
            echo "retry $i"
          done
          exit 1
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
