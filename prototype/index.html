<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A0F">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="WIZ">
<title>WIZ ～死霊術師の迷宮～（試作）</title>
<!--
  03 画面設計の試作（MWIZ-GUI-0001〜0007）。画面の大きさ・配置と主な操作だけを作る。
  ゲームのロジック・保存・音は作らない。値は見本（固定）。07 の実装では使わない。
-->
<style>
:root {
  --wiz-color-background: #0B0A0F;
  --wiz-color-primary: #E8DCC0;
  --wiz-color-frame: #C9A227;
  --wiz-color-line: #FFFFFF;
  --wiz-color-secondary: #FFC845;
  --wiz-color-success: #5CD65C;
  --wiz-color-warning: #FFA726;
  --wiz-color-error: #FF5A4E;
  --wiz-color-info: #4FC3F7;
  --wiz-color-arcane: #A77BD9;
  --wiz-color-text-sub: #A39B8B;
  --wiz-color-disabled: #8C857A;
  --wiz-color-floor: #2A2530;
  --wiz-color-blood: #B3122E;
  --wiz-color-map-frame: #A39B8B;
  --wiz-color-rarity-n: #FFFFFF;
  --wiz-color-rarity-r: #5B8CFF;
  --wiz-color-rarity-sr: #C792EA;
  --wiz-color-rarity-ur: #FF8C1A;
  --wiz-color-rarity-lg: #FF4D6D;
  --wiz-window-line: #FFFFFF;
  --wiz-font: "MS Gothic", "Osaka-Mono", "Noto Sans Mono CJK JP", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gutter-l: max(8px, env(safe-area-inset-left));
  --gutter-r: max(8px, env(safe-area-inset-right));
  --safe-top: max(8px, env(safe-area-inset-top));
  --safe-bottom: max(8px, env(safe-area-inset-bottom));
  --gap: 8px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--wiz-color-background);
  color: var(--wiz-color-primary);
  font-family: var(--wiz-font);
  font-size: 16px; line-height: 1.6; letter-spacing: 0.05em;
  font-variant-numeric: tabular-nums;
  overflow-x: hidden; min-height: 100dvh;
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
*:focus-visible { outline: 2px solid var(--wiz-color-secondary); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; padding: 0; margin: -1px; }

/* 画面の外枠：狭い画面が基本、600px 以上で広げる */
main.frame {
  max-width: 800px; margin: 0 auto;
  padding: var(--safe-top) var(--gutter-r) var(--safe-bottom) var(--gutter-l);
  display: grid; gap: var(--gap); align-content: start;
  min-height: 100dvh;
}
.screen-name { margin: 0; font-size: 24px; line-height: 1.3; color: var(--wiz-color-frame); font-weight: normal; }
@media (max-width: 599px) { .screen-name.hide-narrow { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }

/* ウィンドウ（二重線） */
.win {
  position: relative; border: 2px solid var(--wiz-window-line); outline: 1px solid var(--wiz-window-line); outline-offset: -6px;
  padding: 10px 12px; margin: 0;
}
.win.titled { margin-top: 12px; padding-top: 14px; }
.win.danger { border-color: var(--wiz-color-error); }
.win > .win-title {
  position: absolute; top: -0.8em; left: 12px; margin: 0; padding: 0 4px;
  background: var(--wiz-color-background); color: var(--wiz-color-frame);
  font-size: 18px; line-height: 1.4; font-weight: normal; white-space: nowrap;
}
@media (min-width: 600px) { .win { padding: 12px 16px; } .win.titled { padding-top: 16px; } }

/* メニュー：1 行の高さはメッセージ欄・ステータスと同じ（16px × 1.6 = 25.6px。GUI-0001 §4.1） */
ul.menu { list-style: none; margin: 0; padding: 0; }
ul.menu li {
  display: flex; align-items: center; padding: 0; white-space: pre; cursor: pointer;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
ul.menu li::before { content: "　"; }
ul.menu li.cur { color: var(--wiz-color-secondary); }
ul.menu li:focus-visible { outline: none; }  /* 行を詰めたので枠は上下の行に重なる。カーソルは ▶ と色で示す */
ul.menu li.cur::before { content: "▶"; }
ul.menu li[aria-disabled="true"] { color: var(--wiz-color-disabled); }
ul.menu li .sub { color: var(--wiz-color-text-sub); margin-left: 16px; }
@media (hover: hover) { ul.menu li:hover { color: var(--wiz-color-secondary); } }

/* ボタン */
.btn {
  font: inherit; letter-spacing: inherit; min-height: 48px; min-width: 48px; padding: 0 12px;
  background: transparent; color: var(--wiz-color-primary); border: 2px solid var(--wiz-color-primary); border-radius: 0;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; cursor: pointer;
}
.btn:active { background: var(--wiz-color-secondary); color: var(--wiz-color-background); border-color: var(--wiz-color-secondary); }
@media (hover: hover) { .btn:hover { color: var(--wiz-color-secondary); border-color: var(--wiz-color-secondary); } }
.btn[disabled] { color: var(--wiz-color-disabled); border-color: var(--wiz-color-disabled); }

/* メッセージ欄：高さは 5 行分で固定（どの画面も。GUI-0001 §4.2） */
.log { height: calc(5 * 1.6em); overflow: hidden; position: relative; }
.log p { margin: 0; white-space: pre-wrap; }
.log .success { color: var(--wiz-color-success); }
.log .danger { color: var(--wiz-color-error); }
.log .wait { position: absolute; right: 0; bottom: 0; animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ステータス */
dl.status { display: grid; grid-template-columns: auto 1fr; column-gap: 16px; margin: 0; }
dl.status dt, dl.status dd { margin: 0; white-space: pre; }
dl.status .warn { color: var(--wiz-color-warning); }
.status-row { display: flex; flex-wrap: wrap; column-gap: 14px; white-space: pre; }
.status-row .name { color: var(--wiz-color-frame); }
.status-row .warn { color: var(--wiz-color-warning); }

/* タイトル */
.title-main { max-width: 800px; margin: 0 auto; padding: max(32px, env(safe-area-inset-top)) var(--gutter-r) max(32px, env(safe-area-inset-bottom)) var(--gutter-l); display: grid; gap: 16px; min-height: 100dvh; align-content: center; }
.deco { width: 60%; margin: 0 auto; display: flex; align-items: center; gap: 8px; color: var(--wiz-color-blood); }
.deco::before, .deco::after { content: ""; flex: 1; border-top: 1px solid var(--wiz-color-blood); }
.logo { margin: 0; text-align: center; font-size: 36px; line-height: 1.2; color: var(--wiz-color-frame); letter-spacing: 0.5em; padding-left: 0.5em; font-weight: normal; }
@media (min-width: 600px) { .logo { font-size: 48px; } }
.subtitle { text-align: center; color: var(--wiz-color-arcane); margin: 0; }
.title-menu { margin: 0 auto; width: 100%; max-width: 360px; }
.ver { text-align: right; color: var(--wiz-color-text-sub); margin: 0; }
.title-sub-actions { display: flex; justify-content: space-between; align-items: center; }

/* 名前入力 */
.field label { display: block; color: var(--wiz-color-text-sub); font-size: 13px; }
.field input { width: 100%; font: inherit; font-size: 16px; min-height: 48px; padding: 8px; color: var(--wiz-color-primary); background: transparent; border: 2px solid var(--wiz-color-primary); border-radius: 0; }
.field input:focus { border-color: var(--wiz-color-secondary); outline: none; }
.field .help { display: flex; justify-content: space-between; font-size: 13px; color: var(--wiz-color-text-sub); min-height: 1.5em; }
.field .help .err { color: var(--wiz-color-error); }

/* ダンジョン */
.loc { margin: 0; font-size: 18px; line-height: 1.4; font-weight: normal; }
.fpv { width: var(--fpv-w, 320px); max-width: 100%; aspect-ratio: 4 / 3; margin: 0 auto; }
.fpv svg { width: 100%; height: 100%; display: block; background: var(--wiz-color-background); }
.fpv line { stroke: var(--wiz-color-primary); stroke-width: 2; vector-effect: non-scaling-stroke; }
.fpv .bump { animation: blink1 200ms step-end 1; }
@keyframes blink1 { 50% { opacity: 0; } }
.controls { display: grid; grid-template-columns: auto 1fr; gap: var(--gap); align-items: stretch; }
.map-win { padding: 8px; display: grid; place-items: center; }
.movepad { display: grid; grid-template-areas: "left up right" "left down right"; grid-template-columns: repeat(3, minmax(48px, 1fr)); grid-template-rows: 1fr 1fr; gap: var(--gap); }
.movepad .up { grid-area: up; } .movepad .down { grid-area: down; } .movepad .l { grid-area: left; } .movepad .r { grid-area: right; }
.movepad .btn { padding: 0 4px; }
.actions { display: grid; grid-template-columns: 8.5em 1fr; gap: var(--gap); }
.actions .btn { padding: 0 8px; }
.actions .menu-btn { justify-self: end; }

/* 戦闘 */
.enemy { text-align: center; }
/* 敵の絵 128×128：どの画面も 2 倍（256px）で出す（GUI-0005 §1） */
.enemy-img { display: block; width: 256px; height: 256px; margin: 0 auto 8px; image-rendering: pixelated; }
.enemy-name { margin: 0; font-size: 24px; line-height: 1.3; }
.enemy-name.boss { color: var(--wiz-color-error); }

/* 2 カラム（広い画面だけ） */
.cols { display: grid; gap: 16px; }
@media (min-width: 600px) { .cols { grid-template-columns: 1fr 1fr; align-items: start; } }

/* 装備 */
.slot-row { display: grid; grid-template-columns: 3.5em 1fr; }
.rar-r { color: var(--wiz-color-rarity-r); } .rar-sr { color: var(--wiz-color-rarity-sr); } .rar-ur { color: var(--wiz-color-rarity-ur); } .rar-lg { color: var(--wiz-color-rarity-lg); } .rar-n { color: var(--wiz-color-rarity-n); }
.item { display: inline-flex; flex-wrap: wrap; column-gap: 8px; white-space: normal; }
.item .slot { color: var(--wiz-color-text-sub); }
.item .bonus { white-space: nowrap; }
.diff-up { color: var(--wiz-color-success); } .diff-down { color: var(--wiz-color-warning); }
.filter { display: flex; align-items: center; gap: 4px; }
.filter .btn { min-width: 44px; min-height: 44px; padding: 0; }
.filter .order { margin-left: 8px; color: var(--wiz-color-text-sub); }
.list-scroll { overflow-y: auto; max-height: var(--list-h, calc(8 * 52px)); }

/* 演出・帯・試作のナビ */
.low-hp { --wiz-window-line: #FF5A4E; }
.banner { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 4px) var(--gutter-r) 4px var(--gutter-l); background: #1a1720; border-bottom: 2px solid var(--wiz-color-frame); display: flex; justify-content: space-between; align-items: center; gap: 8px; z-index: 20; }
dialog.install { background: var(--wiz-color-background); color: var(--wiz-color-primary); border: 2px solid var(--wiz-color-line); outline: 1px solid var(--wiz-color-line); outline-offset: -6px; padding: 16px; max-width: min(92vw, 480px); font: inherit; }
dialog.install::backdrop { background: rgba(0,0,0,0.7); }
dialog.install details { margin: 8px 0; }
dialog.install summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; }
.proto-nav { position: fixed; right: 0; top: 40%; z-index: 30; }
.proto-nav > button { font: inherit; font-size: 12px; background: #3a2f48; color: #fff; border: 0; padding: 8px 4px; writing-mode: vertical-rl; opacity: 0.85; }
.proto-panel { position: fixed; inset: auto 8px 8px 8px; max-height: 70dvh; overflow: auto; background: #241e2c; border: 2px solid #A77BD9; padding: 8px; z-index: 31; font-size: 14px; }
.proto-panel .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.proto-panel button { font: inherit; min-height: 40px; background: #3a2f48; color: #fff; border: 1px solid #A77BD9; }
.proto-panel .vp { color: #A77BD9; margin: 4px 0 8px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="proto-nav"><button type="button" id="proto-open" aria-label="試作の画面を選ぶ">試作の画面</button></div>
<div class="proto-panel" id="proto-panel" hidden>
  <p class="vp" id="proto-vp"></p>
  <div class="grid" id="proto-list"></div>
  <p><label><input type="checkbox" id="proto-lowhp"> 体力わずか（赤い枠）</label></p>
  <p><button type="button" id="proto-close">とじる</button></p>
</div>
<dialog class="install" id="install-dialog" aria-labelledby="install-title">
  <h2 id="install-title" style="margin:0 0 8px;font-size:18px;color:var(--wiz-color-frame);font-weight:normal">【 インストール 】</h2>
  <p style="margin:0">ホーム画面に追加すると、アプリのように開けます。通信がなくても遊べます。</p>
  <details data-platform="ios" open><summary>iPhone（Safari）</summary><p>画面下の共有ボタン → 「ホーム画面に追加」</p></details>
  <details data-platform="android"><summary>Android（Chrome）</summary><p>右上のメニュー → 「ホーム画面に追加」</p></details>
  <details data-platform="pc"><summary>パソコン（Chrome / Edge）</summary><p>アドレスバーの右のインストールのボタン</p></details>
  <p style="display:flex;justify-content:flex-end;gap:8px;margin:8px 0 0"><button class="btn" type="button" id="install-close">とじる</button></p>
</dialog>
<script>
// ---- 見本のデータ（固定。ロジックは作らない） ----
const CHAR = { name: 'ゆうしゃ', lv: 12, exp: 1584, next: 288, hp: 120, maxHp: 135, mp: 31, maxMp: 43, atk: 28, def: 30, spd: 22, bAtk: 10, bDef: 12 };
const pad3 = (n) => String(n).padStart(3, ' ');
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
let lines = [];   // メッセージ欄に出ている行（最大 LOG_MAX 行）
const LOG_MAX = 5;
let lowHp = false;
let soundOn = false;

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(typeof k === 'string' ? document.createTextNode(k) : k);
  return e;
}
function win(title, ...kids) {
  const w = el('section', { class: 'win' + (title ? ' titled' : '') });
  if (title) w.append(el('h2', { class: 'win-title', text: `【 ${title} 】` }));
  w.append(...kids);
  return w;
}
function frame(name, { hideNarrow = false } = {}) {
  const m = el('main', { class: 'frame' + (lowHp ? ' low-hp' : '') });
  m.append(el('h1', { class: 'screen-name' + (hideNarrow ? ' hide-narrow' : ''), text: name }));
  return m;
}
// メニュー：↑↓ は端で止まる。タップ・Enter で決定
function menu(label, items, { initial = 0, onCancel } = {}) {
  let cur = initial;
  const ul = el('ul', { class: 'menu', role: 'menu', 'aria-label': label });
  const draw = () => [...ul.children].forEach((li, i) => { li.classList.toggle('cur', i === cur); li.tabIndex = i === cur ? 0 : -1; });
  items.forEach((it, i) => {
    const li = el('li', { role: 'menuitem', 'aria-disabled': it.disabled ? 'true' : false });
    li.append(it.text); if (it.sub) li.append(el('span', { class: 'sub', text: it.sub }));
    li.addEventListener('click', () => { cur = i; draw(); choose(); });
    li.addEventListener('focus', () => { cur = i; draw(); });
    ul.append(li);
  });
  const choose = () => { const it = items[cur]; if (it.disabled) { say(it.reason || 'いまは えらべない'); return; } it.go && it.go(); };
  ul.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { cur = Math.min(items.length - 1, cur + 1); draw(); ul.children[cur].focus(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { cur = Math.max(0, cur - 1); draw(); ul.children[cur].focus(); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === ' ') { choose(); e.preventDefault(); }
    else if (e.key === 'Escape' && onCancel) { onCancel(); }
  });
  draw();
  return ul;
}
function logWin() {
  const w = win(null); w.dataset.testid = 'message-window';
  const box = el('div', { class: 'log', role: 'log', 'aria-live': 'polite' });
  for (const l of lines) box.append(el('p', { class: l.tone || '', text: l.text }));
  w.append(box);
  w.addEventListener('click', () => {});
  if (lines.some((l) => l.tone === 'danger')) w.classList.add('danger');
  return w;
}
// 折り返しで枠に入りきらないときは、古い行から消す（新しい行をいつも見せる）
function trimLog() { const box = $('.log'); while (box && box.children.length > 1 && box.scrollHeight > box.clientHeight + 1) box.firstChild.remove(); }
function say(text, tone) { lines = [...lines, { text, tone }].slice(-LOG_MAX); const old = $('[data-testid="message-window"]'); if (old) { old.replaceWith(logWin()); trimLog(); } }
function statusFull() {
  const warn = CHAR.hp <= CHAR.maxHp * 0.25;
  const dl = el('dl', { class: 'status' },
    el('dt', { text: 'Lv' }), el('dd', { text: pad3(CHAR.lv) }),
    el('dt', { text: 'EXP' }), el('dd', { text: `${pad3(CHAR.exp)}（つぎまで ${CHAR.next}）` }),
    el('dt', { class: warn ? 'warn' : '', text: 'HP' }), el('dd', { class: warn ? 'warn' : '', text: `${pad3(CHAR.hp)}/${pad3(CHAR.maxHp)}${warn ? '！' : ''} (+15)` }),
    el('dt', { text: 'MP' }), el('dd', { text: `${pad3(CHAR.mp)}/${pad3(CHAR.maxMp)}` }),
    el('dt', { text: 'こうげき' }), el('dd', { text: `${pad3(CHAR.atk)} (+${CHAR.bAtk})` }),
    el('dt', { text: 'ぼうぎょ' }), el('dd', { text: `${pad3(CHAR.def)} (+${CHAR.bDef})` }),
    el('dt', { text: 'すばやさ' }), el('dd', { text: pad3(CHAR.spd) }));
  return win(CHAR.name, dl);
}
// 狭い画面のステータス：見出しの代わりに名前を行の先頭に置く 1 行の形（GUI-0001 §4.4）
function statusRow() {
  const warn = CHAR.hp <= CHAR.maxHp * 0.25;
  const row = el('div', { class: 'status-row' },
    el('span', { class: 'name', text: CHAR.name }), el('span', { text: `Lv${pad3(CHAR.lv)}` }),
    el('span', { class: warn ? 'warn' : '', text: `HP${pad3(CHAR.hp)}/${pad3(CHAR.maxHp)}${warn ? '！' : ''}` }), el('span', { text: `MP${pad3(CHAR.mp)}/${pad3(CHAR.maxMp)}` }));
  const w = win(null, row); w.style.padding = '6px 12px'; return w;
}

// ---- 疑似3D（仕様書 §11.5 の枠の座標。見本の視界） ----
const XK = [0, 40, 80, 110, 130], YK = [0, 30, 60, 82, 97], W = 320, H = 240;
const SAMPLE_DEPTHS = [
  { left: 'wall', right: 'open', front: 'open', rightFront: 'wall' },
  { left: 'wall', right: 'wall', front: 'open' },
  { left: 'open', right: 'wall', front: 'wall', leftFront: 'wall', stairs: 'down' },
];
function fpvSvg(depths, bump) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 320 240'); svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', '3F 北を向いている。前方 2 マス先は かべ。右に わかれみち。2 マス先に くだり階段。');
  const line = (x1, y1, x2, y2, front0) => { const l = document.createElementNS(NS, 'line'); Object.entries({ x1, y1, x2, y2 }).forEach(([k, v]) => l.setAttribute(k, v)); if (front0 && bump) l.classList.add('bump'); svg.append(l); };
  depths.forEach((d, k) => {
    const [x0, y0, x1, y1] = [XK[k], YK[k], XK[k + 1], YK[k + 1]];
    for (const side of ['left', 'right']) {
      const fx = (x) => (side === 'left' ? x : W - x);
      if (d[side] === 'wall') { line(fx(x0), y0, fx(x1), y1); line(fx(x0), H - y0, fx(x1), H - y1); line(fx(x1), y1, fx(x1), H - y1); }
      else { line(fx(x0), y1, fx(x1), y1); line(fx(x0), H - y1, fx(x1), H - y1); if (d[side + 'Front'] === 'wall') { line(fx(x1), y1, fx(x1), H - y1); line(fx(x0), y1, fx(x0), H - y1); } }
    }
    if (d.front === 'wall') { line(x1, y1, W - x1, y1, k === 0); line(W - x1, y1, W - x1, H - y1, k === 0); line(W - x1, H - y1, x1, H - y1, k === 0); line(x1, H - y1, x1, y1, k === 0); }
    if (k >= 1 && d.stairs) { const t = document.createElementNS(NS, 'text'); t.setAttribute('x', 160); t.setAttribute('y', ((H - y0) + (H - y1)) / 2); t.setAttribute('text-anchor', 'middle'); t.setAttribute('dominant-baseline', 'middle'); t.setAttribute('fill', '#4FC3F7'); t.setAttribute('font-size', '12'); t.textContent = '↓ くだり階段'; svg.append(t); }
  });

screens.bossBattle = () => { lines = [{ text: '暗黒のネクロマンサーが あらわれた！' }]; screens.battle(true); };
for (const [k, label] of NAV) $('#proto-list').append(el('button', { type: 'button', text: label, onclick: () => { $('#proto-panel').hidden = true; show(k, k === 'equip' || k === 'inventory' || k === 'statusScreen' ? 'inn' : undefined); } }));
$('#proto-open').addEventListener('click', () => { $('#proto-vp').textContent = vpText(); $('#proto-panel').hidden = false; });
$('#proto-close').addEventListener('click', () => { $('#proto-panel').hidden = true; });
$('#proto-lowhp').addEventListener('change', (e) => { lowHp = e.target.checked; CHAR.hp = lowHp ? 20 : 120; show(document.body.dataset.screen || 'title'); });
$('#install-close').addEventListener('click', () => $('#install-dialog').close());
// 測定用（試作だけ）
window.__show = (k) => { lines = []; show(k, k === 'equip' || k === 'inventory' || k === 'statusScreen' ? 'inn' : undefined); };
show('title');
</script>
